<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Nexus Bank</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f8;
    }
    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .user-info {
      background: white;
      padding: 10px 20px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .stat-number {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 10px;
    }
    .user-table {
      background: white;
      border-radius: 20px;
      overflow-x: auto;
      padding: 0 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #f8fafc;
    }
    .freeze-btn {
      background: #f97316;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .unfreeze-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .logout-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1><i class="fas fa-shield-hooded"></i> Nexus Admin Portal</h1>
      <div style="display: flex; gap: 15px; align-items: center;">
        <div class="user-info">
          <i class="fas fa-user-shield"></i>
          <span id="adminName">Admin</span>
        </div>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><h3>Total Users</h3><div class="stat-number" id="totalUsers">--</div></div>
      <div class="stat-card"><h3>Active Users</h3><div class="stat-number" id="activeUsers">--</div></div>
      <div class="stat-card"><h3>Frozen Accounts</h3><div class="stat-number" id="frozenUsers">--</div></div>
    </div>

    <h3 style="margin-bottom: 16px;"><i class="fas fa-users"></i> Manage Users</h3>
    <div class="user-table">
      <table id="usersTable">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Action</th>
        </thead>
        <tbody id="usersBody">
          <tr><td colspan="6" style="text-align:center;">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:8080/api';
    const token = localStorage.getItem('token');
    const userRole = localStorage.getItem('userRole');

    if (!token || userRole !== 'ADMIN') {
      window.location.href = 'login.html';
    }

    document.getElementById('adminName').textContent = localStorage.getItem('userName') || 'Admin';

    async function fetchAllUsers() {
      try {
        const response = await fetch(`${API_BASE_URL}/auth/internal/users`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Failed to fetch users');

        const users = await response.json();
        
        const total = users.length;
        const active = users.filter(u => u.active && !u.frozen).length;
        const frozen = users.filter(u => u.frozen).length;
        
        document.getElementById('totalUsers').textContent = total;
        document.getElementById('activeUsers').textContent = active;
        document.getElementById('frozenUsers').textContent = frozen;

        const tbody = document.getElementById('usersBody');
        tbody.innerHTML = users.map(user => `
          <tr>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.phoneNumber || '--'}</td>
            <td><span style="background:#e0e7ff; padding:2px 10px; border-radius:20px;">${user.role}</span></td>
            <td>${user.frozen ? '<span style="color:#f97316;">❄️ Frozen</span>' : '<span style="color:#10b981;">✓ Active</span>'}</td>
            <td>
              <button class="${user.frozen ? 'unfreeze-btn' : 'freeze-btn'}" onclick="toggleFreeze('${user.id}', ${!user.frozen})">
                ${user.frozen ? 'Unfreeze' : 'Freeze'}
              </button>
            </td>
          </tr>
        `).join('');

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('usersBody').innerHTML = '<tr><td colspan="6">Error loading users</td></tr>';
      }
    }

    async function toggleFreeze(userId, shouldFreeze) {
      try {
        const response = await fetch(`${API_BASE_URL}/auth/internal/users/${userId}/freeze?freeze=${shouldFreeze}`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          fetchAllUsers(); // Refresh list
        } else {
          alert('Failed to update user status');
        }
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    fetchAllUsers();
  </script>
</body>
</html>
