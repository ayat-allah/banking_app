<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard - Nexus Bank</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f8;
      color: #0b1a33;
    }
    .dashboard-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px 28px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
      gap: 16px;
    }
    .logo h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #0b2b5c, #1e4a76);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .user-card {
      background: white;
      padding: 8px 22px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .avatar {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .balance-card {
      background: linear-gradient(145deg, #0a2540, #0f3b5c);
      border-radius: 28px;
      padding: 28px 32px;
      margin-bottom: 32px;
      color: white;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .balance-amount {
      font-size: 2.5rem;
      font-weight: 800;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 36px;
    }
    .stat-card {
      background: white;
      border-radius: 20px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-number {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 6px;
    }
    .transactions-table {
      background: white;
      border-radius: 20px;
      overflow-x: auto;
      padding: 0 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 14px 20px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #f8fafc;
      font-weight: 600;
    }
    .logout-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      margin-left: 15px;
    }
    .logout-btn:hover {
      background: #b91c1c;
    }
    .loading {
      text-align: center;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="header">
      <div class="logo">
        <h1><i class="fas fa-building-columns"></i> NEXUS BANK</h1>
      </div>
      <div style="display: flex; align-items: center;">
        <div class="user-card">
          <div class="avatar" id="userAvatar">JD</div>
          <div>
            <strong id="userName">--</strong><br>
            <span id="userEmail" style="font-size: 12px; color: #666;">--</span>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <div class="balance-card">
      <div>
        <h3 style="opacity:0.8;"><i class="fas fa-wallet"></i> Total Balance</h3>
        <div class="balance-amount" id="totalBalance">$ --</div>
        <div id="accountNumber" style="font-family: monospace; margin-top: 8px;">•••• ----</div>
      </div>
      <div>
        <div class="stat-card" style="background: rgba(255,255,255,0.15); display: inline-block;">
          <span id="accountStatus">Active</span>
        </div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div><p style="color:#666;">Savings</p><div class="stat-number" id="savings">$ --</div></div>
        <i class="fas fa-piggy-bank" style="font-size: 32px; color:#4facfe;"></i>
      </div>
      <div class="stat-card">
        <div><p style="color:#666;">Monthly Spend</p><div class="stat-number" id="monthlySpend">$ --</div></div>
        <i class="fas fa-chart-line" style="font-size: 32px; color:#4facfe;"></i>
      </div>
    </div>

    <h3 style="margin: 28px 0 16px 0;"><i class="fas fa-history"></i> Recent Transactions</h3>
    <div class="transactions-table">
      <table id="transactionsTable">
        <thead>
          <tr><th>Date</th><th>Description</th><th>Amount</th><th>Status</th>
        </thead>
        <tbody id="transactionsBody">
          <tr><td colspan="4" class="loading">Loading transactions...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:8080/api';

    // Check authentication
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
    }

    // Display user info
    document.getElementById('userName').textContent = localStorage.getItem('userName') || 'Customer';
    document.getElementById('userEmail').textContent = localStorage.getItem('userEmail') || '';
    
    const name = localStorage.getItem('userName') || 'User';
    document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();

    async function fetchDashboardData() {
      try {
        const userId = localStorage.getItem('userId');
        const response = await fetch(`${API_BASE_URL}/auth/users/${userId}`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          if (response.status === 401 || response.status === 403) {
            logout();
          }
          throw new Error('Failed to fetch user data');
        }

        const userData = await response.json();
        
        // Update UI with real data from backend
        document.getElementById('totalBalance').textContent = `$ ${userData.balance?.toLocaleString() || '1,284.73'}`;
        document.getElementById('savings').textContent = `$ ${userData.savings?.toLocaleString() || '4,290.50'}`;
        document.getElementById('monthlySpend').textContent = `$ ${userData.monthlySpend?.toLocaleString() || '1,234'}`;
        document.getElementById('accountStatus').innerHTML = userData.frozen ? '🔒 Frozen' : '✓ Active';
        
        if (userData.frozen) {
          document.getElementById('accountStatus').style.color = '#f97316';
        }

        // Note: Add transactions endpoint in your backend
        // For now using mock data
        const transactionsBody = document.getElementById('transactionsBody');
        transactionsBody.innerHTML = `
          <tr><td>May 21, 2025</td><td>Salary Deposit</td><td style="color:green;">+$4,250.00</td><td>Completed</td></tr>
          <tr><td>May 18, 2025</td><td>Grocery Store</td><td style="color:red;">-$124.38</td><td>Completed</td></tr>
          <tr><td>May 15, 2025</td><td>Online Transfer</td><td style="color:red;">-$500.00</td><td>Pending</td></tr>
        `;

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('transactionsBody').innerHTML = '<tr><td colspan="4">Error loading data</td></tr>';
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    fetchDashboardData();
  </script>
</body>
</html>
