<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Nexus Bank</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
    }
    .register-box {
      background: white;
      padding: 30px;
      width: 340px;
      border-radius: 16px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.2);
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #0b2b5c;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(95deg, #4facfe, #00f2fe);
      border: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(79,172,254,0.3);
    }
    #msg {
      margin-top: 10px;
      font-size: 14px;
    }
    a {
      text-decoration: none;
      color: #4facfe;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-box">
    <h2>📝 Open Account</h2>
    <input type="text" id="name" placeholder="Full Name">
    <input type="email" id="email" placeholder="Email address">
    <input type="text" id="phone" placeholder="Phone Number">
    <input type="password" id="password" placeholder="Create password (min 8 chars)">
    <button onclick="register()">Register</button>
    <div id="msg"></div>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script src='register.js'></script>
</body>
</html>
