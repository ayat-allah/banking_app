<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transfer Money</title>

  <style>

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial;
      background: linear-gradient(to right, #4facfe, #00f2fe);
    }

    .transfer-box{
      background:white;
      padding:30px;
      width:320px;
      border-radius:12px;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
      text-align:center;
    }

    input{
      width:100%;
      padding:10px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:10px;
      background:#4facfe;
      color:white;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#2196f3;
    }

    #msg{
      margin-top:10px;
    }

  </style>

</head>

<body>

  <div class="transfer-box">

    <h2>Transfer Money</h2>

    <input type="text" id="username" placeholder="Receiver Username">

    <input type="number" id="amount" placeholder="Amount">

    <button onclick="transferMoney()">Send</button>

    <div id="msg"></div>

  </div>

  <script>

    function transferMoney(){

      let username = document.getElementById("username").value;
      let amount = document.getElementById("amount").value;
      let msg = document.getElementById("msg");

      if(username === "" || amount === ""){

        msg.style.color = "red";
        msg.innerHTML = "Please fill all fields";

        return;
      }

      msg.style.color = "green";
      msg.innerHTML = "Transfer Successful ✔";

    }

  </script>

</body>
</html>
