<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nexus Bank</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
    }
    .login-box {
      background: white;
      padding: 30px;
      width: 340px;
      border-radius: 16px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.2);
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #0b2b5c;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(95deg, #4facfe, #00f2fe);
      border: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(79,172,254,0.3);
    }
    #msg {
      margin-top: 10px;
      font-size: 14px;
    }
    .register-link {
      margin-top: 20px;
      font-size: 14px;
    }
    .register-link a {
      color: #4facfe;
      text-decoration: none;
      font-weight: bold;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🔐 Nexus Bank Login</h2>
    <input type="email" id="email" placeholder="Email address">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="msg"></div>
    <div class="register-link">
      Don't have an account? <a href="register.html">Create one here</a>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
